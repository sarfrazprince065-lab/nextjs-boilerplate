services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    ports: ["3000:3000"]
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
    command: ["sh","-ec","npm ci && exec npx next dev -H 0.0.0.0 -p 3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
